[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cam3d"
version = "0.1.0"
description = "cam3D - free, local, photorealistic 3D scanning (photogrammetry) engine and server"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.8",
    "pycolmap>=3.10",
    "open3d>=0.18",
    "trimesh>=4.0",
    "pycollada>=0.8",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "aiofiles>=23",
    "pydantic>=2",
    "websockets>=12",
    "qrcode>=7.4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cam3d = "cam3d.cli:main"

[tool.setuptools.packages.find]
include = ["cam3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
